<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>段考複習計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f6f9; --card:#ffffff; --ink:#1f2a44; --muted:#5d6b85; --line:#d5dde8;
  --hl:#ffe45c; --ok:#2e8b6a; --warn:#d6403f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141a2b; --card:#1d2640; --ink:#e8edf8; --muted:#9aa8c4; --line:#33405f;
    --ok:#4fc79c; --warn:#ff7b78; color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.6;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
}
.wrap{max-width:960px; margin:0 auto; padding:32px 20px 64px; background:var(--paper); min-height:100vh}
header{display:flex; flex-wrap:wrap; gap:16px 32px; align-items:flex-end; justify-content:space-between; margin-bottom:28px}
h1{font-size:clamp(2rem,6vw,3.2rem); font-weight:900; line-height:1.1; margin:0; letter-spacing:.02em}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%); padding:0 .1em}
.next{font-size:.95rem; color:var(--muted)}
.next b{color:var(--ink); font-size:1.15rem}
h2{font-size:1.2rem; margin:0 0 12px}
section{margin-bottom:32px}
.panel{background:var(--card); border:1.5px solid var(--ink); border-radius:6px; padding:16px 18px}
.today li{display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--line)}
.today li:last-child{border-bottom:0}
.tag{font-size:.8rem; font-weight:700; background:var(--hl); color:#1f2a44; border-radius:3px; padding:0 8px; white-space:nowrap; margin-top:2px}
ul{list-style:none; margin:0; padding:0}
.empty{color:var(--muted); margin:0}
form.add{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:end}
label{display:grid; gap:4px; font-size:.85rem; color:var(--muted)}
input[type=text],input[type=date],textarea{
  font:inherit; color:var(--ink); background:var(--paper); border:1.5px solid var(--line); border-radius:4px; padding:8px 10px; width:100%;
}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--hl); outline-offset:1px; border-color:var(--ink)}
button{
  font:inherit; font-weight:700; cursor:pointer; color:#1f2a44; background:var(--hl);
  border:1.5px solid var(--ink); border-radius:4px; padding:8px 16px;
}
button:hover{filter:brightness(.96)}
button.ghost{background:transparent; color:var(--muted); border-color:var(--line); font-weight:500; padding:4px 10px; font-size:.85rem}
button.ghost:hover{color:var(--warn); border-color:var(--warn)}
.subjects{display:grid; gap:18px}
.subject h3{margin:0; font-size:1.3rem}
.subject .top{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:baseline}
.meta{font-size:.9rem; color:var(--muted)}
.meta .days{font-weight:700; color:var(--ink)}
.meta .days.soon{color:var(--warn)}
.bar{height:12px; border:1.5px solid var(--ink); border-radius:3px; margin:12px 0; overflow:hidden; background:var(--paper)}
.bar i{display:block; height:100%; background:var(--hl); width:0; transition:width .25s}
.topics li{display:flex; align-items:center; gap:10px; padding:5px 0}
.topics input[type=checkbox]{width:20px; height:20px; accent-color:var(--ok); flex:none}
.topics li.done span{color:var(--muted); text-decoration:line-through}
.topics li button{margin-left:auto; opacity:.55}
.topics li:hover button,.topics li button:focus-visible{opacity:1}
.topic-add{display:grid; gap:8px; margin-top:12px}
.topic-add textarea{min-height:2.6em; resize:vertical}
.topic-add .row{display:flex; justify-content:space-between; align-items:center; gap:8px}
.hint{font-size:.8rem; color:var(--muted)}
.topics li button+button{margin-left:0}
.topics li small{white-space:nowrap}
@media (max-width:620px){
  form.add{grid-template-columns:1fr}
  .wrap{padding:20px 12px 48px}
  button{min-height:40px}
  button.ghost{min-height:34px}
  .topics input[type=checkbox],.today input[type=checkbox]{width:24px!important;height:24px!important}
  .topic-add .row{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>段考<span>複習計畫</span></h1>
    <div class="next"><div id="next"></div><a href="calendar.html" style="color:inherit;font-weight:700">行事曆：活動、每週讀書、每日單字</a></div>
  </header>

  <section class="panel today" aria-labelledby="today-h">
    <h2 id="today-h">今天建議完成</h2>
    <ul id="today"></ul>
  </section>

  <section class="panel" aria-labelledby="add-h">
    <h2 id="add-h">新增科目</h2>
    <form class="add" id="addForm">
      <label>科目名稱<input type="text" id="sName" placeholder="例如：數學" required maxlength="30"></label>
      <label>考試日期<input type="date" id="sDate" required></label>
      <button type="submit">新增科目</button>
    </form>
  </section>

  <section aria-labelledby="list-h">
    <h2 id="list-h">我的科目</h2>
    <div class="subjects" id="subjects"></div>
  </section>
</div>

<script>
(function(){
  var KEY = 'exam-review-plan-v1';
  var state = { subjects: [] };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var d = JSON.parse(raw); if(d && Array.isArray(d.subjects)) state = d; }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  var CP = [];
  function calPlans(){
    try{ var d = JSON.parse(localStorage.getItem('exam-calendar-v1')); return (d && Array.isArray(d.plans)) ? d.plans : []; }
    catch(e){ return []; }
  }
  function schedTag(sid, tid){
    var p = CP.find(function(x){ return x.ref && x.ref.s===sid && x.ref.t===tid; });
    return p ? '<small class="hint">排在 '+fmt(p.date)+'</small>' : '';
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function startOfToday(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function daysLeft(dateStr){
    var p = dateStr.split('-').map(Number);
    var t = new Date(p[0], p[1]-1, p[2]);
    return Math.round((t - startOfToday())/86400000);
  }
  function fmt(dateStr){ var p=dateStr.split('-'); return Number(p[1])+'/'+Number(p[2]); }
  function dayText(n){ return n<0 ? '已結束' : n===0 ? '今天考試' : '剩 '+n+' 天'; }

  function findTopic(sid,tid){
    var s = state.subjects.find(function(x){return x.id===sid;});
    var t = s && s.topics.find(function(x){return x.id===tid;});
    return {s:s,t:t};
  }

  function render(){
    CP = calPlans();
    state.subjects.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    // header: next exam
    var upcoming = state.subjects.filter(function(s){return daysLeft(s.date)>=0;})[0];
    document.getElementById('next').innerHTML = upcoming
      ? '下一科：<b>'+esc(upcoming.name)+'</b>（'+fmt(upcoming.date)+'，'+dayText(daysLeft(upcoming.date))+'）'
      : '還沒有即將到來的考試';

    // today's suggestions
    var todayItems = [];
    var tk = new Date().toLocaleDateString('sv-SE'), sched = {};
    CP.forEach(function(p){ if(p.ref && p.date===tk) sched[p.ref.t] = 1; });
    state.subjects.forEach(function(s){
      var n = daysLeft(s.date);
      if(n < 0) return;
      var remain = s.topics.filter(function(t){return !t.done;});
      if(!remain.length) return;
      var per = Math.ceil(remain.length / Math.max(1, n));
      var first = remain.filter(function(t){ return sched[t.id]; });
      var rest = remain.filter(function(t){ return !sched[t.id]; });
      first.concat(rest).slice(0, Math.max(per, first.length)).forEach(function(t){ todayItems.push({s:s,t:t}); });
    });
    var todayEl = document.getElementById('today');
    todayEl.innerHTML = todayItems.length ? todayItems.map(function(x){
      return '<li><input type="checkbox" data-sid="'+x.s.id+'" data-tid="'+x.t.id+'" aria-label="完成：'+esc(x.t.text)+'" style="width:20px;height:20px;accent-color:var(--ok)">'
        + '<span class="tag">'+esc(x.s.name)+'</span><span>'+esc(x.t.text)+'</span></li>';
    }).join('') : '<li class="empty">'+(state.subjects.length ? '今天的進度都完成了。' : '先新增一個科目和考試日期，再把要複習的單元加進去。')+'</li>';

    // subjects
    var box = document.getElementById('subjects');
    if(!state.subjects.length){ box.innerHTML = '<p class="empty">還沒有科目。在上方輸入科目名稱和考試日期。</p>'; return; }
    box.innerHTML = state.subjects.map(function(s){
      var n = daysLeft(s.date);
      var total = s.topics.length;
      var done = s.topics.filter(function(t){return t.done;}).length;
      var pct = total ? Math.round(done/total*100) : 0;
      var remain = total - done;
      var pace = (n>=0 && remain) ? '，每天約 '+Math.ceil(remain/Math.max(1,n))+' 個單元' : '';
      return '<article class="panel subject" data-sid="'+s.id+'">'
        + '<div class="top"><h3>'+esc(s.name)+'</h3>'
        + '<div class="meta">'+fmt(s.date)+' 考試　<span class="days'+(n>=0&&n<=3?' soon':'')+'">'+dayText(n)+'</span></div></div>'
        + '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'
        + '<div class="meta">已完成 '+done+' / '+total+' 個單元（'+pct+'%）'+pace+'</div>'
        + '<ul class="topics">'+s.topics.map(function(t){
            return '<li class="'+(t.done?'done':'')+'"><input type="checkbox" data-sid="'+s.id+'" data-tid="'+t.id+'"'+(t.done?' checked':'')+' aria-label="完成：'+esc(t.text)+'"><span>'+esc(t.text)+'</span>'
              + schedTag(s.id, t.id)
              + '<button type="button" class="ghost" data-edit-topic="'+t.id+'" aria-label="修改單元：'+esc(t.text)+'">修改</button>'
              + '<button type="button" class="ghost" data-del-topic="'+t.id+'" aria-label="刪除單元：'+esc(t.text)+'">刪除</button></li>';
          }).join('')+'</ul>'
        + '<div class="topic-add"><textarea placeholder="輸入要複習的單元，一行一個" aria-label="新增單元"></textarea>'
        + '<div class="row"><span class="hint">可一次貼上多行</span><span><button type="button" data-add-topics>加入單元</button> <button type="button" class="ghost" data-del-subject>刪除科目</button></span></div></div>'
        + '</article>';
    }).join('');
  }

  document.getElementById('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var name = document.getElementById('sName').value.trim();
    var date = document.getElementById('sDate').value;
    if(!name || !date) return;
    state.subjects.push({id:uid(), name:name, date:date, topics:[]});
    save(); this.reset(); render();
  });

  document.addEventListener('change',function(e){
    var el = e.target;
    if(el.type==='checkbox' && el.dataset.sid){
      var r = findTopic(el.dataset.sid, el.dataset.tid);
      if(r.t){ r.t.done = el.checked; save(); render(); }
    }
  });

  document.addEventListener('click',function(e){
    var b = e.target.closest('button'); if(!b) return;
    var card = b.closest('.subject'); if(!card) return;
    var s = state.subjects.find(function(x){return x.id===card.dataset.sid;}); if(!s) return;
    if(b.hasAttribute('data-add-topics')){
      var ta = card.querySelector('textarea');
      ta.value.split('\n').map(function(l){return l.trim();}).filter(Boolean).forEach(function(l){
        s.topics.push({id:uid(), text:l.slice(0,100), done:false});
      });
      save(); render();
    } else if(b.hasAttribute('data-edit-topic')){
      var tp = s.topics.find(function(t){return t.id===b.dataset.editTopic;});
      var nv = tp && prompt('修改單元名稱', tp.text);
      if(nv && nv.trim()){ tp.text = nv.trim().slice(0,100); save(); render(); }
    } else if(b.hasAttribute('data-del-topic')){
      s.topics = s.topics.filter(function(t){return t.id!==b.dataset.delTopic;});
      save(); render();
    } else if(b.hasAttribute('data-del-subject')){
      if(confirm('確定要刪除「'+s.name+'」和它的所有單元嗎？')){
        state.subjects = state.subjects.filter(function(x){return x.id!==s.id;});
        save(); render();
      }
    }
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode!==229 && e.target.matches('.topic-add textarea')){
      e.preventDefault();
      e.target.closest('.subject').querySelector('[data-add-topics]').click();
    }
  });
  window.addEventListener('storage',function(){ load(); render(); });

  load(); render();
})();
</script>
<script src="shared.js"></script>
</body>
</html>
