<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行事曆｜段考複習計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f6f9;--card:#fff;--ink:#1f2a44;--muted:#5d6b85;--line:#d5dde8;--hl:#ffe45c;--ok:#2e8b6a;--warn:#d6403f;--ev:#dbe6ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141a2b;--card:#1d2640;--ink:#e8edf8;--muted:#9aa8c4;--line:#33405f;--ok:#4fc79c;--warn:#ff7b78;--ev:#2c3a66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;line-height:1.1;margin:0}
h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .1em}
a{color:var(--ink);font-weight:700}
h2{font-size:1.1rem;margin:0 0 8px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 16px;margin-bottom:16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav strong{font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:.8rem;color:var(--muted);text-align:center;padding:2px 0}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--hl);color:#1f2a44;border:1.5px solid var(--ink);border-radius:4px;padding:3px 4px 3px 10px;font-weight:700;font-size:.9rem;cursor:grab;touch-action:none;user-select:none}
.chip button{padding:0 6px;font-size:.85rem;background:transparent;border:0;color:#1f2a44;opacity:.6}
.chip button:hover{opacity:1;filter:none}
.ghostchip{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-50%);padding-right:10px}
.dragtxt{cursor:grab;touch-action:none;user-select:none}
.cell.over{outline:3px dashed var(--ink);outline-offset:-3px}
.cell .u{font-size:.72rem;line-height:1.25;background:var(--hl);color:#1f2a44;border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.sel .u{background:#fff;border:1px solid #1f2a44}
.cell{min-height:96px;text-align:left;padding:4px 5px;background:var(--paper);border:1.5px solid var(--line);border-radius:4px;color:var(--ink);font-weight:400;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.cell.out{opacity:.45}
.cell.today{border-color:var(--ink)}
.cell.sel{background:var(--hl);color:#1f2a44;border-color:var(--ink)}
.cell .n{font-weight:700;font-size:.9rem}
.cell .e{font-size:.72rem;line-height:1.25;background:var(--ev);color:var(--ink);border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.sel .e{background:#fff7c2;color:#1f2a44}
.cell .v{font-size:.7rem;color:var(--ok);font-weight:700}
.cell.sel .v{color:#1f2a44}
button{font:inherit;font-weight:700;cursor:pointer;color:#1f2a44;background:var(--hl);border:1.5px solid var(--ink);border-radius:4px;padding:6px 14px}
button:hover{filter:brightness(.96)}
button.ghost{background:transparent;color:var(--muted);border-color:var(--line);font-weight:500;padding:2px 8px;font-size:.82rem}
button.ghost:hover{color:var(--warn);border-color:var(--warn)}
button.cell{font-weight:400;padding:4px 5px}
input[type=text],input[type=date],input[type=time],input[type=number]{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--hl);outline-offset:1px}
label{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.row{display:grid;gap:8px;margin-top:8px}
.row.two{grid-template-columns:1fr 1fr}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
li button{margin-left:auto}
li.done span{text-decoration:line-through;color:var(--muted)}
li input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);flex:none}
.empty{color:var(--muted);margin:0;font-size:.9rem}
.big{font-size:1.15rem;font-weight:700}
details summary{cursor:pointer;font-weight:700}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.cell .x{font-size:.72rem;line-height:1.25;background:var(--warn);color:#fff;border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){
  .wrap{padding:16px 10px 48px}
  .cell{min-height:52px;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:3px}
  .cell .n{width:100%;font-size:.85rem}
  .cell .e,.cell .u,.cell .v,.cell .x{font-size:0;width:9px;height:9px;padding:0;border-radius:50%;display:block}
  .cell .e{background:#5b8def}
  .cell .v{background:var(--ok)}
  .cell.sel .e,.cell.sel .u,.cell.sel .v{outline:1px solid #1f2a44}
  button{min-height:40px}
  button.ghost{min-height:32px}
  .chip{min-height:40px}
  li input[type=checkbox]{width:22px;height:22px}
  .row.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>行事<span>曆</span></h1>
  <a href="index.html">回到複習計畫</a>
</header>
<div class="layout">
  <div>
  <div class="panel">
    <h2>單元模塊</h2>
    <div class="row" style="grid-template-columns:1fr auto;align-items:end;margin-top:0">
      <label>自己填單元名稱<input type="text" id="unText" maxlength="30" placeholder="例如：數學第一課"></label>
      <button type="button" id="unAdd">加入模塊</button>
    </div>
    <div class="tray" id="tray"></div>
    <div id="tray2"></div>
    <p class="hint">把模塊拖到下方日曆的某一天，就會排進那天；也可以先點選日期，再點一下模塊。已排的單元可以再拖到別天。</p>
  </div>
  <div class="panel">
    <div class="nav">
      <button type="button" id="prev" aria-label="上個月">上個月</button>
      <strong id="title"></strong>
      <span><button type="button" id="todayBtn">今天</button> <button type="button" id="next">下個月</button></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  </div>
  <div id="side"></div>
</div>
</div>

<script>
(function(){
  var KEY='exam-calendar-v1', state={events:[],books:[],vocab:{},units:[],plans:[]};
  var WD=['日','一','二','三','四','五','六'];
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.events&&d.books&&d.vocab){d.units=d.units||[];d.plans=d.plans||[];state=d;}}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function uid(){return Math.random().toString(36).slice(2,10);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
  function weekKey(s){var d=pd(s);d.setDate(d.getDate()-d.getDay());return ds(d);}
  function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
  var PK='exam-review-plan-v1', SUBS=[];
  function readSubs(){try{var d=JSON.parse(localStorage.getItem(PK));return d&&Array.isArray(d.subjects)?d.subjects:[];}catch(e){return [];}}
  function topicOf(ref){
    if(!ref)return null;
    var s=SUBS.find(function(x){return x.id===ref.s;});
    var t=s&&s.topics.find(function(x){return x.id===ref.t;});
    return t?{s:s,t:t}:null;
  }
  function setTopicDone(ref,v){
    try{
      var d=JSON.parse(localStorage.getItem(PK));
      var s=d.subjects.find(function(x){return x.id===ref.s;});
      var t=s&&s.topics.find(function(x){return x.id===ref.t;});
      if(t){t.done=v;localStorage.setItem(PK,JSON.stringify(d));}
    }catch(e){}
  }
  function planDone(p){var r=topicOf(p.ref);return r?r.t.done:p.done;}
  function planText(p){var r=topicOf(p.ref);return r?r.s.name+'｜'+r.t.text:p.text;}
  var todayStr=ds(new Date()), sel=todayStr, view=pd(todayStr);view.setDate(1);

  function renderCal(){
    document.getElementById('title').textContent=view.getFullYear()+' 年 '+(view.getMonth()+1)+' 月';
    var first=new Date(view.getFullYear(),view.getMonth(),1);
    var start=new Date(first);start.setDate(1-first.getDay());
    var h=WD.map(function(w){return '<div class="dow">'+w+'</div>';}).join('');
    for(var i=0;i<42;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);var k=ds(d);
      var evs=state.events.filter(function(e){return e.date===k;}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
      var v=state.vocab[k];
      h+='<button type="button" class="cell'+(d.getMonth()!==view.getMonth()?' out':'')+(k===todayStr?' today':'')+(k===sel?' sel':'')+'" data-date="'+k+'" aria-label="'+k+'">'
        +'<span class="n">'+d.getDate()+'</span>'
        +evs.slice(0,2).map(function(e){return '<span class="e">'+esc(e.title)+'</span>';}).join('')
        +(evs.length>2?'<span class="e">+'+(evs.length-2)+' 項</span>':'')
        +SUBS.filter(function(s){return s.date===k;}).map(function(s){return '<span class="x">考 '+esc(s.name)+'</span>';}).join('')
        +state.plans.filter(function(p){return p.date===k;}).slice(0,2).map(function(p){return '<span class="u">'+(planDone(p)?'✓ ':'')+esc(planText(p))+'</span>';}).join('')
        +(v?'<span class="v">'+(v.done?'✓ ':'')+esc(v.text)+'</span>':'')+'</button>';
    }
    document.getElementById('grid').innerHTML=h;
  }

  function renderSide(){
    var d=pd(sel), wk=weekKey(sel), wEnd=addDays(wk,6);
    var evs=state.events.filter(function(e){return e.date===sel;}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
    var books=state.books.filter(function(b){return b.week===wk;});
    var v=state.vocab[sel];
    var h='<div class="panel"><div class="big">'+(d.getMonth()+1)+' 月 '+d.getDate()+' 日（週'+WD[d.getDay()]+'）</div></div>';

    var pls=state.plans.filter(function(p){return p.date===sel;}).map(function(p){return {id:p.id,text:planText(p),done:planDone(p)};});
    SUBS.filter(function(s){return s.date===sel;}).forEach(function(s){
      h+='<div class="panel"><strong style="color:var(--warn)">這天考試：'+esc(s.name)+'</strong></div>';
    });
    h+='<div class="panel"><h2>這天排的單元</h2><ul>'+(pls.length?pls.map(function(p){
      return '<li class="'+(p.done?'done':'')+'"><input type="checkbox" data-plan-done="'+p.id+'"'+(p.done?' checked':'')+' aria-label="完成：'+esc(p.text)+'"><span class="dragtxt" data-plan="'+p.id+'">'+esc(p.text)+'</span><button type="button" class="ghost" data-del-plan="'+p.id+'" aria-label="刪除：'+esc(p.text)+'">刪除</button></li>';
    }).join(''):'<li class="empty">把上方的單元模塊拖到日曆，或點一下模塊排進這天。</li>')+'</ul></div>';
    h+='<div class="panel"><h2>今天的活動</h2><ul>'+(evs.length?evs.map(function(e){
      return '<li><span>'+(e.time?esc(e.time)+'　':'')+esc(e.title)+'</span><button type="button" class="ghost" data-del-ev="'+e.id+'" aria-label="刪除活動：'+esc(e.title)+'">刪除</button></li>';
    }).join(''):'<li class="empty">這天還沒有活動。</li>')+'</ul>'
    +'<div class="row two"><label>活動名稱<input type="text" id="evTitle" maxlength="40" placeholder="例如：社團、補習"></label><label>時間（可不填）<input type="time" id="evTime"></label></div>'
    +'<div class="row"><button type="button" id="addEv">新增活動</button></div></div>';

    h+='<div class="panel"><h2>本週要讀的書</h2><p class="hint" style="margin:0 0 6px">'+wk.slice(5).replace('-','/')+' – '+wEnd.slice(5).replace('-','/')+'（週日到週六）</p><ul>'+(books.length?books.map(function(b){
      return '<li class="'+(b.done?'done':'')+'"><input type="checkbox" data-book="'+b.id+'"'+(b.done?' checked':'')+' aria-label="讀完：'+esc(b.title)+'"><span>'+esc(b.title)+(b.note?'｜'+esc(b.note):'')+'</span><button type="button" class="ghost" data-del-book="'+b.id+'" aria-label="刪除：'+esc(b.title)+'">刪除</button></li>';
    }).join(''):'<li class="empty">這週還沒有安排書。</li>')+'</ul>'
    +'<div class="row two"><label>書名<input type="text" id="bkTitle" maxlength="40"></label><label>本週目標<input type="text" id="bkNote" maxlength="40" placeholder="例如：第 3–5 章"></label></div>'
    +'<div class="row"><button type="button" id="addBook">加到這一週</button></div></div>';

    h+='<div class="panel"><h2>今天的英文單字</h2>'
    +(v?'<ul><li class="'+(v.done?'done':'')+'"><input type="checkbox" id="vDone"'+(v.done?' checked':'')+' aria-label="今天的單字已背完"><span>'+esc(v.text)+'</span><button type="button" class="ghost" id="vDel">清除</button></li></ul>':'<p class="empty">這天還沒有設定單字範圍。</p>')
    +'<div class="row"><label>範圍<input type="text" id="vText" maxlength="40" placeholder="例如：第 1–30 個"></label><button type="button" id="vSave">儲存範圍</button></div>'
    +'<details style="margin-top:12px"><summary>一次排好多天</summary>'
    +'<div class="row two"><label>起始日<input type="date" id="bStart" value="'+sel+'"></label><label>連續幾天<input type="number" id="bDays" min="1" max="120" value="14"></label></div>'
    +'<div class="row two"><label>每天幾個<input type="number" id="bPer" min="1" max="500" value="30"></label><label>從第幾個開始<input type="number" id="bFrom" min="1" value="1"></label></div>'
    +'<div class="row"><button type="button" id="bGo">產生每日範圍</button></div>'
    +'<p class="hint">會覆蓋這些日期原本的單字範圍。</p></details></div>';
    document.getElementById('side').innerHTML=h;
  }

  function renderTray(){
    document.getElementById('tray').innerHTML=state.units.length?state.units.map(function(u){
      return '<span class="chip" tabindex="0" role="button" data-unit="'+u.id+'">'+esc(u.text)+'<button type="button" data-del-unit="'+u.id+'" aria-label="刪除模塊：'+esc(u.text)+'">×</button></span>';
    }).join(''):'<p class="empty">還沒有模塊，先在上面輸入一個。</p>';
  }
  function renderHomeTray(){
    var sched={};
    state.plans.forEach(function(p){if(p.ref)sched[p.ref.t]=1;});
    var h='';
    SUBS.forEach(function(s){
      s.topics.forEach(function(t){
        if(t.done||sched[t.id])return;
        h+='<span class="chip" tabindex="0" role="button" data-uref="'+s.id+':'+t.id+'">'+esc(s.name)+'｜'+esc(t.text)+'</span>';
      });
    });
    document.getElementById('tray2').innerHTML=h?'<p class="hint" style="margin:10px 0 0">首頁的單元（還沒排進日曆）</p><div class="tray">'+h+'</div>':'';
  }
  function all(){SUBS=readSubs();renderTray();renderHomeTray();renderCal();renderSide();}
  function val(id){return document.getElementById(id).value.trim();}

  document.getElementById('prev').onclick=function(){view.setMonth(view.getMonth()-1);renderCal();};
  document.getElementById('next').onclick=function(){view.setMonth(view.getMonth()+1);renderCal();};
  document.getElementById('todayBtn').onclick=function(){sel=todayStr;view=pd(todayStr);view.setDate(1);all();};

  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.date){sel=b.dataset.date;var d=pd(sel);if(d.getMonth()!==view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1);}all();return;}
    if(b.id==='unAdd'){addUnit();return;}
    if(b.dataset.delUnit){state.units=state.units.filter(function(x){return x.id!==b.dataset.delUnit;});save();all();return;}
    if(b.dataset.delPlan){state.plans=state.plans.filter(function(x){return x.id!==b.dataset.delPlan;});save();all();return;}
    if(b.id==='addEv'){var t=val('evTitle');if(!t)return;state.events.push({id:uid(),title:t,date:sel,time:val('evTime')});save();all();}
    else if(b.dataset.delEv){state.events=state.events.filter(function(x){return x.id!==b.dataset.delEv;});save();all();}
    else if(b.id==='addBook'){var bt=val('bkTitle');if(!bt)return;state.books.push({id:uid(),week:weekKey(sel),title:bt,note:val('bkNote'),done:false});save();all();}
    else if(b.dataset.delBook){state.books=state.books.filter(function(x){return x.id!==b.dataset.delBook;});save();all();}
    else if(b.id==='vSave'){var vt=val('vText');if(!vt)return;state.vocab[sel]={text:vt,done:false};save();all();}
    else if(b.id==='vDel'){delete state.vocab[sel];save();all();}
    else if(b.id==='bGo'){
      var s=val('bStart'),n=+val('bDays'),per=+val('bPer'),from=+val('bFrom');
      if(!s||!(n>0)||!(per>0)||!(from>0))return;
      for(var i=0;i<n;i++){var a=from+i*per;state.vocab[addDays(s,i)]={text:'第 '+a+'–'+(a+per-1)+' 個',done:false};}
      save();all();
    }
  });
  document.addEventListener('change',function(e){
    var el=e.target;
    if(el.dataset.planDone){var pl=state.plans.find(function(x){return x.id===el.dataset.planDone;});if(pl){pl.done=el.checked;if(pl.ref)setTopicDone(pl.ref,el.checked);save();all();}}
    else if(el.dataset.book){var bk=state.books.find(function(x){return x.id===el.dataset.book;});if(bk){bk.done=el.checked;save();all();}}
    else if(el.id==='vDone'&&state.vocab[sel]){state.vocab[sel].done=el.checked;save();all();}
  });

  function addUnit(){
    var t=val('unText');if(!t)return;
    state.units.push({id:uid(),text:t});
    document.getElementById('unText').value='';
    save();all();
  }
  document.getElementById('unText').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();addUnit();}
  });

  // Drag & drop (pointer events, works with mouse and touch)
  var drag=null;
  function clearOver(){document.querySelectorAll('.cell.over').forEach(function(n){n.classList.remove('over');});}
  function cellAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest('.cell');}
  function drop(el,date){
    if(el.dataset.uref){
      var q=el.dataset.uref.split(':'),r=topicOf({s:q[0],t:q[1]});
      if(r)state.plans.push({id:uid(),text:r.s.name+'｜'+r.t.text,date:date,done:false,ref:{s:q[0],t:q[1]}});
    }else if(el.dataset.unit){
      var u=state.units.find(function(x){return x.id===el.dataset.unit;});
      if(u)state.plans.push({id:uid(),text:u.text,date:date,done:false});
    }else if(el.dataset.plan){
      var p=state.plans.find(function(x){return x.id===el.dataset.plan;});
      if(p)p.date=date;
    }
    sel=date;save();all();
  }
  function endDrag(){
    if(drag&&drag.ghost)drag.ghost.remove();
    clearOver();drag=null;
  }
  document.addEventListener('pointerdown',function(e){
    var c=e.target.closest('[data-unit],[data-uref],[data-plan]');
    if(!c||e.target.closest('button,input'))return;
    drag={el:c,x:e.clientX,y:e.clientY,moved:false,ghost:null};
  });
  document.addEventListener('pointermove',function(e){
    if(!drag)return;
    if(!drag.moved){
      if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
      drag.moved=true;
      var g=drag.el.cloneNode(true);
      g.className='chip ghostchip';g.removeAttribute('data-unit');g.removeAttribute('data-uref');g.removeAttribute('data-plan');
      document.body.appendChild(g);drag.ghost=g;
    }
    e.preventDefault();
    drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    clearOver();
    var c=cellAt(e.clientX,e.clientY);if(c)c.classList.add('over');
  });
  document.addEventListener('pointerup',function(e){
    if(!drag)return;
    var d=drag,c=d.moved?cellAt(e.clientX,e.clientY):null;
    endDrag();
    if(d.moved){if(c)drop(d.el,c.dataset.date);}
    else if(d.el.dataset.unit||d.el.dataset.uref){drop(d.el,sel);}
  });
  document.addEventListener('pointercancel',endDrag);

  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    if(e.isComposing||e.keyCode===229)return;
    var t=e.target;
    if(t.matches&&t.matches('.chip')){e.preventDefault();drop(t,sel);return;}
    var map={evTitle:'addEv',evTime:'addEv',bkTitle:'addBook',bkNote:'addBook',vText:'vSave'};
    if(e.key==='Enter'&&map[t.id]){e.preventDefault();document.getElementById(map[t.id]).click();}
  });
  window.addEventListener('storage',function(){load();all();});

  load();all();
})();
</script>
<script src="shared.js"></script>
</body>
</html>
